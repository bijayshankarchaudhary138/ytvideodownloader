# Reverse proxy for ytvideodownloader (Ubuntu/Debian nginx).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ytvideodownloader
#   sudo ln -sf /etc/nginx/sites-available/ytvideodownloader /etc/nginx/sites-enabled/
#   sudo sed -i 's/dl.example.com/YOUR_DOMAIN/g' /etc/nginx/sites-available/ytvideodownloader
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN        # adds the TLS block + auto-renew
#
# Key points:
#  * proxy_buffering off  → SSE progress (/api/events) and file downloads stream
#    immediately instead of being held in nginx's buffers.
#  * long read timeouts   → a 4K download or a 20-minute job must not be cut off.
#  * Host/X-Forwarded-*   → the app stamps canonical URLs and rate-limits the
#    real client IP (keep TRUST_PROXY=1 on the app side).

upstream ytvideodownloader {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dl.example.com;

    # The API only accepts small JSON bodies.
    client_max_body_size 1m;
    client_body_timeout 60s;

    # gzip (the app also compresses, this covers static files nginx serves first)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers for the HTML shell (the app sets its own CSP too).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://ytvideodownloader;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Live progress + large downloads: never buffer, never time out early.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Server-Sent Events: the one endpoint where buffering breaks the UI.
    location = /api/events {
        proxy_pass http://ytvideodownloader;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;       # ← must be off
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 24h;    # the stream stays open for the whole session
    }

    # File downloads can be big; stream them straight through.
    location /api/files/ {
        proxy_pass http://ytvideodownloader;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed static assets: cache them at the edge.
    location /assets/ {
        proxy_pass http://ytvideodownloader;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never let a crawler index API output.
    location = /robots.txt {
        proxy_pass http://ytvideodownloader;
        proxy_set_header Host $host;
    }
}
